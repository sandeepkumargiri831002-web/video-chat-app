
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Chat App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101828;
      color: white;
    }

    .header {
      background: #1570ef;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 25px;
      text-align: center;
    }

    .welcome {
      margin-top: 30px;
      font-size: 28px;
    }

    .subtitle {
      color: #b8c0cc;
      margin: 15px 0 30px;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 16px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #1570ef;
    }

    .chat {
      background: #12b76a;
    }

    .login {
      background: #344054;
    }
  </style>
</head>

<body>

  <div class="header">
    Video Chat
  </div>

  <div class="container">

    <div class="welcome">
      Welcome 👋
    </div>

    <div class="subtitle">
      Chat and Video Call with your friends
    </div>

    <button onclick="videoCall()">
      📹 Video Call
    </button>

    <button class="chat" onclick="openChat()">
      💬 Chat
    </button>

    <button class="login" onclick="login()">
      🔐 Login / Sign Up
    </button>

  </div>

  <script>
    function videoCall() {
      alert("Video Call feature coming soon!");
    }

    function openChat() {
      alert("Chat feature coming soon!");
    }

    function login() {
      alert("Login / Sign Up coming soon!");
    }
  </script>

</body>
</html>
